[workspace]
resolver = "2"
members = ["crates/proto", "crates/agent", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/midnights-ra1n/NextPane"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
