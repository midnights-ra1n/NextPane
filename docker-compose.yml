# NextPane panel. Edit the values below, then: docker compose up -d
# First start: docker compose logs nextpane | grep "setup code"
services:
  nextpane:
    image: ghcr.io/midnights-ra1n/nextpane:latest
    restart: unless-stopped
    ports:
      - "3000:3000"   # "127.0.0.1:3000:3000" when a reverse proxy runs on this host
    environment:
      NEXTPANE_TLS: "off"   # "on" = HTTPS on port 3000 without a reverse proxy (self-signed)
      NEXTPANE_RELEASE_URL: https://github.com/midnights-ra1n/NextPane/releases
    volumes:
      - nextpane-data:/data

  # Optional reverse proxy with automatic HTTPS: docker compose --profile caddy up -d
  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from panel.example.com --to nextpane:3000
    volumes:
      - caddy-data:/data

volumes:
  nextpane-data:
  caddy-data:
